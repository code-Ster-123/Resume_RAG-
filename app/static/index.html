<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Agent - Interactive Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-surface: #111827;
      --bg-card: #1f2937;
      --border-color: #374151;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --user-bubble: #1e3a8a;
      --bot-bubble: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-title p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--bg-card);
      color: var(--text-main);
      border-color: #4b5563;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - 67px);
      padding: 0 16px;
    }

    /* Messages Area */
    #chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat-history::-webkit-scrollbar {
      width: 6px;
    }
    #chat-history::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }

    /* Welcome Card */
    .welcome-card {
      background: linear-gradient(180deg, rgba(31, 41, 55, 0.7) 0%, rgba(17, 24, 39, 0.7) 100%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin: 20px 0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .welcome-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .welcome-card p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto 18px auto;
      line-height: 1.5;
    }

    .starter-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: #93c5fd;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #fff;
      transform: translateY(-1px);
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.assistant {
      align-self: flex-start;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .user .avatar {
      background: #2563eb;
    }

    .assistant .avatar {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    .bubble {
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.6;
      word-break: break-word;
    }

    .user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .assistant .bubble {
      background: var(--bot-bubble);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }

    /* Markdown styling inside bubble */
    .bubble p:not(:last-child) {
      margin-bottom: 8px;
    }

    .bubble ul, .bubble ol {
      margin-left: 20px;
      margin-bottom: 8px;
    }

    .bubble li {
      margin-bottom: 4px;
    }

    .bubble strong {
      color: #60a5fa;
    }

    .bubble code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: monospace;
    }

    /* Semantic Cache Badge */
    .cache-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    /* Typing Dots Animation */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 14px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Footer */
    .input-container {
      padding: 16px 0 20px 0;
      position: relative;
    }

    .input-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      display: flex;
      align-items: flex-end;
      padding: 8px 12px;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14.5px;
      resize: none;
      max-height: 140px;
      min-height: 24px;
      line-height: 24px;
      padding: 4px 4px;
    }

    textarea::placeholder {
      color: #6b7280;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
      transform: none;
    }

    .footer-hint {
      font-size: 11px;
      color: #6b7280;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">📄</div>
      <div class="brand-title">
        <h1>Resume RAG Assistant</h1>
        <p>Interactive CV Intelligence</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Agent Online</span>
      </div>
      <button class="clear-btn" onclick="clearChat()">Clear</button>
    </div>
  </header>

  <!-- Chat Container -->
  <main>
    <div id="chat-history">
      <!-- Welcome Card -->
      <div class="welcome-card" id="welcome-card">
        <h2>Ask anything about Utkarsh's Resume</h2>
        <p>This assistant uses LlamaIndex RAG with Gemini to answer questions about skills, background, projects, and education.</p>
        <div class="starter-chips">
          <button class="chip" onclick="askQuestion(this.innerText)">Who is Utkarsh Ujwal?</button>
          <button class="chip" onclick="askQuestion(this.innerText)">What is his educational background?</button>
          <button class="chip" onclick="askQuestion(this.innerText)">Summarize his Gen AI & agentic experience</button>
          <button class="chip" onclick="askQuestion(this.innerText)">What are his core technical skills?</button>
        </div>
      </div>
    </div>

    <!-- Input Box -->
    <div class="input-container">
      <div class="input-box">
        <textarea
          id="query-input"
          rows="1"
          placeholder="Ask a question about the candidate..."
          onkeydown="handleKeyDown(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button id="send-btn" class="send-btn" onclick="submitQuery()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="footer-hint">Press Enter to send, Shift + Enter for new line</div>
    </div>
  </main>

  <script>
    const chatHistory = document.getElementById("chat-history");
    const queryInput = document.getElementById("query-input");
    const sendBtn = document.getElementById("send-btn");
    const welcomeCard = document.getElementById("welcome-card");

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 140) + "px";
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitQuery();
      }
    }

    function askQuestion(text) {
      queryInput.value = text;
      submitQuery();
    }

    function clearChat() {
      chatHistory.innerHTML = "";
      if (welcomeCard) chatHistory.appendChild(welcomeCard);
    }

    function appendMessage(role, content = "") {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.innerText = role === "user" ? "👤" : "🤖";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "assistant" && content) {
        bubble.innerHTML = marked.parse(content);
      } else {
        bubble.innerText = content;
      }

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatHistory.appendChild(row);
      chatHistory.scrollTop = chatHistory.scrollHeight;
      return bubble;
    }

    function showTypingIndicator() {
      const row = document.createElement("div");
      row.className = "message-row assistant";
      row.id = "typing-row";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.innerText = "🤖";

      const bubble = document.createElement("div");
      bubble.className = "bubble typing-indicator";
      bubble.innerHTML = `
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      `;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatHistory.appendChild(row);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function removeTypingIndicator() {
      const row = document.getElementById("typing-row");
      if (row) row.remove();
    }

    async function submitQuery() {
      const query = queryInput.value.trim();
      if (!query) return;

      // Hide welcome card on first message
      if (welcomeCard && welcomeCard.parentNode) {
        welcomeCard.remove();
      }

      // Add user message to UI
      appendMessage("user", query);
      queryInput.value = "";
      queryInput.style.height = "24px";
      queryInput.disabled = true;
      sendBtn.disabled = true;

      showTypingIndicator();

      try {
        const response = await fetch("/api/v1/chat/stream", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ query: query })
        });

        if (!response.ok) {
          removeTypingIndicator();
          const errData = await response.text();
          appendMessage("assistant", `⚠️ **Error (${response.status}):** ${errData}`);
          return;
        }

        const isCacheHit = response.headers.get("X-Cache") === "HIT";
        const simScore = response.headers.get("X-Cache-Similarity");
        let badgeHtml = "";
        if (isCacheHit) {
          const simPct = simScore ? ` (${Math.round(parseFloat(simScore) * 100)}% match)` : "";
          badgeHtml = `<div class="cache-badge">⚡ Cached${simPct}</div>`;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let accumulatedText = "";
        let assistantBubble = null;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          if (!chunk) continue;

          // Remove typing indicator on first arriving chunk
          if (!assistantBubble) {
            removeTypingIndicator();
            assistantBubble = appendMessage("assistant", "");
          }

          accumulatedText += chunk;
          assistantBubble.innerHTML = badgeHtml + marked.parse(accumulatedText);
          chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Handle case where stream finished with no text
        if (!assistantBubble) {
          removeTypingIndicator();
          appendMessage("assistant", "*(No response generated)*");
        }
      } catch (err) {
        removeTypingIndicator();
        appendMessage("assistant", `⚠️ **Network Error:** Could not connect to API server. (${err.message})`);
      } finally {
        queryInput.disabled = false;
        sendBtn.disabled = false;
        queryInput.focus();
      }
    }
  </script>
</body>
</html>
